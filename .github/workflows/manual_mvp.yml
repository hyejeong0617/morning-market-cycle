name: MVP Test

on:
  schedule:
    - cron: '50 8 * * 1-5'
      timezone: "Europe/Berlin"
  push:
    branches: [main]
    paths:
      - "main.py"
      - "requirements.txt"
      - "src/**"
      - "scripts/**"
      - "prompts/**"
      - ".github/workflows/manual_mvp.yml"
  workflow_dispatch:
    inputs:
      email_test_only:
        description: "Send email from the saved Oct 6 fixture only (no OpenAI/Notion)"
        required: false
        default: false
        type: boolean
      skip_research:
        description: "Run market-data only"
        required: false
        default: false
        type: boolean
      skip_notion:
        description: "Skip Market Inbox sync"
        required: false
        default: false
        type: boolean
      skip_email:
        description: "Skip Morning Brief email"
        required: false
        default: false
        type: boolean

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Run MVP
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6-luna' }}
          BRIEF_TIMEZONE: Europe/Berlin
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID || 'de2d05dd-6694-4cb0-b7d0-c65db73cb01a' }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.email_test_only }}" = "true" ]; then
            PYTHONPATH=. python scripts/send_email_from_json.py data/fixtures/email_test_2026-10-06.json
          elif [ "${{ github.event_name }}" = "push" ]; then
            python main.py --skip-research
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_research }}" = "true" ]; then
            python main.py --skip-research
          else
            ARGS=""
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_notion }}" = "true" ]; then
              ARGS="$ARGS --skip-notion"
            fi
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_email }}" = "true" ]; then
              ARGS="$ARGS --skip-email"
            fi
            python main.py $ARGS
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.email_test_only == true) }}
        with:
          name: mvp-output
          path: |
            data/runs/*.json
            data/runs/*.md
