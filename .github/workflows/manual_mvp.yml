name: MVP Test

on:
  schedule:
    - cron: '50 8 * * 1-5'
      timezone: "Europe/Berlin"
  push:
    branches: [main]
    paths:
      - "main.py"
      - "requirements.txt"
      - "src/**"
      - "scripts/**"
      - "prompts/**"
      - ".github/workflows/manual_mvp.yml"
  workflow_dispatch:
    inputs:
      email_test_only:
        description: "Send email from the saved Oct 6 fixture only (no OpenAI)"
        required: false
        default: false
        type: boolean
      skip_research:
        description: "Run market-data only"
        required: false
        default: false
        type: boolean
      skip_email:
        description: "Skip Morning Brief email"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Run MVP
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6-luna' }}
          BRIEF_TIMEZONE: Europe/Berlin
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.email_test_only }}" = "true" ]; then
            PYTHONPATH=. python scripts/send_email_from_json.py data/fixtures/email_test_2026-10-06.json
          elif [ "${{ github.event_name }}" = "push" ]; then
            python main.py --skip-research
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_research }}" = "true" ]; then
            python main.py --skip-research
          else
            ARGS=""
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_email }}" = "true" ]; then
              ARGS="$ARGS --skip-email"
            fi
            python main.py $ARGS
          fi

      - name: Persist daily market record
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.email_test_only != true && inputs.skip_research != true) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runs/*.json data/runs/*.md
          if git diff --cached --quiet; then
            echo "No daily record changes to commit."
          else
            git commit -m "data: save daily market record"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.email_test_only == true) }}
        with:
          name: mvp-output
          path: |
            data/runs/*.json
            data/runs/*.md
